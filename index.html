<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이실장 안심케어 OX 퀴즈</title>
    <style>
        /* 프리텐다드 폰트 로딩 강화 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

        :root {
            --primary: #4285F4; 
            --primary-light: #E8F0FE;
            --success: #34A853;
            --danger: #EA4335;
            --bg: #F8F9FA;
            --text: #3C4043;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* 모바일 터치 시 파란 박스 제거 */
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg); 
            margin: 0;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            overflow-x: hidden;
        }

        #app {
            width: 95%; /* 모바일 대응: 화면 너비의 95% */
            max-width: 1100px; /* PC 대응: 최대 너비 제한 */
            min-height: 650px;
            background: white; 
            padding: clamp(20px, 5vw, 60px); /* 화면 크기에 따라 패딩 조절 */
            border-radius: 32px; 
            box-shadow: 0 12px 40px rgba(32, 33, 36, 0.1);
            text-align: center; 
            position: relative; 
            z-index: 5;
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            margin: 20px 0;
        }

        .nav-controls {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; z-index: 10;
        }

        .nav-btn {
            background: #fff; border: 1px solid #DADCE0; padding: 8px 18px;
            border-radius: 100px; font-size: 0.9rem; color: #5F6368;
            cursor: pointer;
        }

        h1 { 
            font-size: clamp(2.2rem, 8vw, 4.8rem); 
            margin: 0; color: var(--text); 
            letter-spacing: -1px; line-height: 1.2; 
        }

        .question-text { 
            font-size: clamp(1.6rem, 6vw, 3.8rem); 
            font-weight: 800; line-height: 1.4; 
            margin: 30px 0; min-height: 180px; 
            word-break: keep-all; color: #202124; 
        }

        .btn-group { display: flex; gap: 20px; justify-content: center; width: 100%; }

        .btn-ox {
            flex: 1; /* 가로로 동일한 비율 */
            max-width: 280px;
            aspect-ratio: 1 / 1; /* 정사각형 유지 */
            font-size: clamp(4rem, 15vw, 11rem); 
            font-weight: 900;
            border: none; border-radius: 30px; cursor: pointer;
            transition: transform 0.1s;
            display: flex; align-items: center; justify-content: center; color: white;
        }

        .btn-o { background: var(--success); box-shadow: 0 8px 0 #288d44; }
        .btn-x { background: var(--danger); box-shadow: 0 8px 0 #c53929; }
        .btn-ox:active { transform: translateY(4px); box-shadow: none; }

        #overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; justify-content: center; align-items: center; flex-direction: column;
            padding: 20px;
        }

        #result-mark { font-size: clamp(4rem, 12vw, 10rem); font-weight: 900; color: white; margin-bottom: 15px; }

        .explanation-card { 
            background: white; color: var(--text); padding: clamp(20px, 4vw, 45px); 
            border-radius: 24px; max-width: 800px; width: 100%;
            font-size: clamp(1.1rem, 4vw, 2.3rem); line-height: 1.5; 
            box-shadow: 0 24px 48px rgba(0,0,0,0.2); word-break: keep-all; 
        }

        .next-btn { 
            margin-top: 30px; padding: 15px clamp(30px, 8vw, 80px); 
            font-size: clamp(1.2rem, 4vw, 2.2rem); 
            font-weight: bold; border-radius: 100px; cursor: pointer; 
            background: white; color: var(--text); border: none; 
        }

        .qr-area { display: flex; align-items: center; gap: 15px; background: #fff; padding: 10px 20px; border-radius: 20px; border: 1px solid #DADCE0; }
        .qr-img { width: 80px; height: 80px; object-fit: contain; }
        
        .bottom-section { 
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center; 
            gap: 20px; border-top: 1px solid #DADCE0; padding-top: 30px; margin-top: 20px; width: 100%; 
        }

        @media (max-width: 600px) {
            #app { border-radius: 20px; min-height: 550px; }
            .btn-group { gap: 15px; }
            .btn-ox { border-radius: 20px; }
            .qr-area { width: 100%; justify-content: center; }
            .nav-controls { top: 15px; }
        }

        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 150; }
        .arcade-btn {
            font-size: clamp(1.5rem, 5vw, 2.2rem); padding: 20px 60px; 
            background: var(--primary); color: white; border: none; border-radius: 100px; 
            cursor: pointer; font-weight: bold; transition: all 0.2s;
            background-image: linear-gradient(to bottom, #77a9f7, #4285F4); 
            box-shadow: 0 8px 0 #2854a8; position: relative; top: 0;
        }
        .arcade-btn:active { top: 4px; box-shadow: none; }
    </style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div id="app">
    <div class="nav-controls" id="nav-controls" style="display: none;">
        <button class="nav-btn" onclick="prevQuestion()" id="prev-btn" style="visibility: hidden;">❮ 이전</button>
        <button class="nav-btn" onclick="renderStart()">처음으로 ⟲</button>
    </div>
    <div id="content">로딩 중...</div>
</div>

<div id="overlay">
    <div id="result-mark"></div>
    <div class="explanation-card" id="explanation"></div>
    <button class="next-btn" onclick="closeOverlay()">다음으로 ❯</button>
</div>

<script>
    // 질문 데이터 (동일)
    const allQuestions = [
        { q: "등기부등본을 계약서 작성 당일에|확인하면 대항력 확보를 할 수있다.", a: "X", desc: "잔금 지급 직후와 전입신고 직후까지 변동 사항을 실시간으로 확인해야 안전합니다." },
        { q: "공동명의 주택 계약 시, 지분권자 과반의|동의가 없다면 계약이 무효될 수 있다.", a: "O", desc: "공유물 관리 행위는 지분의 과반수로 결정해야 하므로 전원의 동의나 위임장 확인이 필수입니다." },
        { q: "대리인의 인감증명서는 발급일로부터|6개월 이내의 서류여야 안전하다.", a: "X", desc: "통상적으로 발급일로부터 3개월 이내의 최신 서류여야 안전합니다." },
        { q: "확정일자는 해당 주택에|실거주를 시작한 이후에 부여받을 수 있다.", a: "X", desc: "임대차 계약서만 있다면 입주 전이라도 주민센터나 온라인을 통해 미리 받을 수 있습니다." },
        { q: "등기부 '을구'가 깨끗하다면|내 보증금은 1순위다.", a: "X", desc: "을구가 깨끗해도 압류 전의 고액 체납이 있다면 보증금보다 우선 변제될 수 있습니다." },
        { q: "전입신고 당일 설정된 저당권은|세입자의 대항력보다 후순위이다.", a: "X", desc: "전입신고 효력은 익일 0시에 발생하므로, 당일 설정된 저당권이 법적으로 앞섭니다." },
        { q: "다가구주택은 전체 세입자의 보증금 합계를 꼭 확인해야 한다.", a: "O", desc: "건물 전체가 경매에 넘어갈 경우 내 보증금의 배당 순위를 결정짓는 핵심 정보입니다." },
        { q: "임차권등기명령은 보증금을 받지 못한 채|이사가야 할 때 대항력을 유지해주는 장치다.", a: "O", desc: "임차권등기가 완료되면 이사를 가도 기존의 순위와 대항력이 보존됩니다." },
        { q: "이사 다음날 전입신고를 해도 권리 확보에는 지장이 없다.", a: "X", desc: "미루는 사이 대출이 실행되면 보증금 변제 순위가 뒤로 밀리게 됩니다." },
        { q: "이실장 안심케어는 전세 사기 피해 시|실손금을 보상해 줄까요?", a: "O", desc: "네! 권리관계 문제로 보증금을 잃게 될 경우 실손 보상을 지원합니다." }
    ];

    let quizSet = [];
    let currentIdx = 0;
    let score = 0;

    // 사운드 함수 최적화 (사용자 상호작용 후 실행)
    let audioCtx;
    function playSfx(isCorrect) {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(isCorrect ? 523 : 220, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    // 폭죽 효과 (모바일 성능 고려)
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function createConfetti() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        for (let i = 0; i < 50; i++) {
            particles.push({
                x: canvas.width / 2, y: canvas.height / 2,
                color: `hsl(${Math.random() * 360}, 70%, 60%)`,
                vX: (Math.random() - 0.5) * 20, vY: (Math.random() - 0.5) * 20,
                radius: Math.random() * 4 + 2, alpha: 1
            });
        }
        tick();
    }
    function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, i) => {
            p.x += p.vX; p.y += p.vY; p.vY += 0.3; p.alpha -= 0.02;
            ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
            if (p.alpha <= 0) particles.splice(i, 1);
        });
        if (particles.length > 0) requestAnimationFrame(tick);
    }

    function renderStart() {
        document.getElementById('nav-controls').style.display = 'none';
        document.getElementById('content').innerHTML = `
            <div class="start-container">
                <div class="start-brand">이실장 안심케어</div>
                <h1 class="start-title">내 보증금은 내가 지킨다<br>🙆🏻🙅🏻‍♂️ 퀴즈</h1>
                <button class="arcade-btn" onclick="startQuiz()">도전하기</button>
            </div>
        `;
    }

    function startQuiz() {
        if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        quizSet = [...allQuestions].sort(() => Math.random() - 0.5).slice(0, 3);
        currentIdx = 0; score = 0;
        document.getElementById('nav-controls').style.display = 'flex';
        showQuestion();
    }

    function showQuestion() {
        const qData = quizSet[currentIdx];
        const displayQ = qData.q.replace('|', '<br>');
        document.getElementById('prev-btn').style.visibility = currentIdx > 0 ? 'visible' : 'hidden';
        document.getElementById('content').innerHTML = `
            <div style="font-size: 1.2rem; color: var(--primary); font-weight: bold; margin-bottom: 10px;">문항 ${currentIdx + 1} / 3</div>
            <div class="question-text">${displayQ}</div>
            <div class="btn-group">
                <button class="btn-ox btn-o" onclick="checkAnswer('O')">O</button>
                <button class="btn-ox btn-x" onclick="checkAnswer('X')">X</button>
            </div>
        `;
    }

    function prevQuestion() { if (currentIdx > 0) { currentIdx--; showQuestion(); } }

    function checkAnswer(userAns) {
        const isCorrect = userAns === quizSet[currentIdx].a;
        const overlay = document.getElementById('overlay');
        const mark = document.getElementById('result-mark');
        if (isCorrect) { score++; playSfx(true); createConfetti(); overlay.style.backgroundColor = "rgba(52, 168, 83, 0.98)"; mark.innerText = "🙆🏻 정답입니다!"; }
        else { playSfx(false); overlay.style.backgroundColor = "rgba(234, 67, 53, 0.98)"; mark.innerText = "🙅🏻‍♂️ 아쉽습니다!"; }
        document.getElementById('explanation').innerHTML = `<div style="color:black; font-size:1.2rem; margin-bottom:8px; font-weight:bold;">✅ 알아두면 좋은 정보</div>${quizSet[currentIdx].desc}`;
        overlay.style.display = 'flex';
    }

    function closeOverlay() {
        document.getElementById('overlay').style.display = 'none';
        currentIdx++;
        if (currentIdx < quizSet.length) showQuestion();
        else showFinalResult();
    }

    function showFinalResult() {
        document.getElementById('nav-controls').style.display = 'none';
        let emoji, rank, quote, desc;
        if (score === 3) {
            emoji = "🐔"; rank = "안심 만렙 장닭"; quote = '"부동산 사기는 다 쪼아버린다!"';
            desc = "완벽한 지식을 갖춘 당신, 고수의 향기가 나요.<br><b>이실장 안심케어</b>로 철통보안 상태를 유지하세요!";
        } else if (score === 2) {
            emoji = "🐥"; rank = "똘똘한 병아리"; quote = '"이제 좀 삐약삐약 하시네요!"';
            desc = "기본은 알지만 2% 부족한 느낌!<br>그 빈 틈을 <b>이실장 안심케어</b>로 채워보세요.";
        } else {
            emoji = "🥚"; rank = "무방비 알맹이"; quote = '"지금 이대로 계약하면 위험해요!"';
            desc = "보증금이 쏙 빠져나갈 위기!<br>지금 당장 <b>이실장 안심케어</b>로 보호막을 치세요.";
        }
        
        document.getElementById('content').innerHTML = `
            <div class="final-container">
                <div class="score-visual">${score} / 3 정답</div>
                <div class="rank-info">
                    <div style="font-size: 5rem; margin-bottom: 10px;">${emoji}</div>
                    <div class="rank-title">${rank}</div>
                    <div class="rank-quote">${quote}</div>
                    <div class="rank-desc">${desc}</div>
                </div>
                <div class="bottom-section">
                    <div class="qr-area">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://cc.aipartner.com/" class="qr-img" alt="QR">
                        <div class="qr-text">
                            <div style="font-weight:800; font-size:1rem;">전세사기 걱정 끝!</div>
                            <div style="font-size:0.8rem;">안심케어 알아보기</div>
                        </div>
                    </div>
                    <button class="next-btn" onclick="renderStart()" style="background:#BDC1C6; color: white; margin:0; padding:15px 30px;">처음으로</button>
                </div>
            </div>
        `;
    }

    renderStart();
</script>
</body>
</html>
